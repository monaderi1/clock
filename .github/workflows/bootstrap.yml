name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate widget RemoteViews layouts
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ['app/src/main/res/layout/widget_dual_clock.xml', 'app/src/main/res/layout/widget_dual_clock_horizontal.xml']:
              root = ET.parse(path).getroot()
              valid = {'LinearLayout', 'TextView', 'TextClock'}
              invalid = [e.tag for e in root.iter() if e.tag not in valid]
              if invalid:
                  raise SystemExit(f'Unsupported view(s) in {path}: {invalid}')
              print(f'{path}: OK')
          PY
      - name: Build Android widget APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DualCityClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2 app/build/outputs/apk/debug/app-debug.apk#clock-v1.2.apk --title "Clock v1.2 — widget fix" --notes "Fix widget addition on Android launchers by replacing an unsupported RemoteViews element. Large adjustable clocks for two cities. Debug-signed APK: uninstall older debug builds before installing if Android reports a signature conflict."
